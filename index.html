<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Bon Bon ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      font-family: Arial, sans-serif;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      padding: 30px;
    }

    h1 {
      color: #ff477e;
      font-size: 42px;
    }

    .question {
      font-size: 25px;
      color: #e63946;
      margin: 25px;
    }

    .gif {
      width: 200px;
      border-radius: 20px;
    }

    button {
      border: none;
      padding: 15px 25px;
      margin: 10px;
      border-radius: 15px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #ff477e;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Lô lô bô bô ❤️</h1>

    <img class="gif"
         src="./img/ahatamatar.gif"
         alt="cute">

    <div class="question">
      Vợ thúi biết nay ngày gì koooo? 🥺
    </div>

    <button onclick="goBirthday()">KHÔNG 😭</button>

    <button onclick="goBirthday()">NOOOOO 😭</button>

  </div>

  <script>
    function goBirthday() {
      window.location.href = "./final.html";
    }
  </script>

</body>
</html>
