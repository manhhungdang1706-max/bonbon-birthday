<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>It's For You - Now Smile!</title>
  <!-- Google Fonts for a cartoonish style -->
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <style>
   <body>

  <h1>Lô lô bô bô ❤️</h1>

  <div class="video-container">
    <img src="./img/ahatamatar.gif" alt="GIF" width="200" height="200">
  </div>

  <div class="question">
    <p>Vợ thúi biết nay ngày gì koooo? 🥺</p>
  </div>

  <div class="button-container">
    <button class="button" onclick="goBirthday()">KHÔNG 😭</button>
    <button class="button no" onclick="goBirthday()">NOOOO 😭</button>
  </div>

  <div class="hamster-container">
    <img src="./img/hamster.jpg" alt="Hamster" height="100" class="hamster">
  </div>

  <audio id="music" autoplay loop>
    <source src="./music/ahatamatarmusic.mp3" type="audio/mp3">
  </audio>

  <button class="play-music-button" onclick="playMusic()">
    Bật nhạc nè 🎵
  </button>

  <script>
    function playMusic() {
      document.getElementById("music").play();
    }

    function goBirthday() {
      window.location.href = "final.html";
    }
  </script>

</body>
</html>
